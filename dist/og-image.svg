<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PrepVisor — AI Interview Preparation for Software Engineers</title>
  <desc id="description">Coding, system design, and mock interview preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2563eb" fill-opacity=".12" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" />
  <rect x="0" y="0" width="24" height="630" fill="url(#blue)" />
  <rect x="56" y="58" width="1088" height="514" rx="34" fill="#ffffff" fill-opacity=".96" stroke="#dbeafe" stroke-width="2" />
  <rect x="82" y="125" width="270" height="270" rx="30" fill="#2563eb" />
  <image href="logo.png" x="82" y="125" width="270" height="270" preserveAspectRatio="xMidYMid meet" />
  <rect x="82" y="422" width="270" height="5" rx="2.5" fill="#2563eb" fill-opacity=".2" />
  <circle cx="97" cy="468" r="7" fill="#2563eb" />
  <circle cx="117" cy="468" r="7" fill="#60a5fa" />
  <circle cx="137" cy="468" r="7" fill="#bfdbfe" />
  <text x="414" y="177" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#2563eb">PREPVISOR</text>
  <path d="M414 203h78" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <text x="414" y="290" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-1.4" fill="#0f172a">AI Interview Preparation</text>
  <text x="414" y="359" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-1.4" fill="#0f172a">for Software Engineers</text>
  <text x="414" y="444" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#475569">Coding  •  System Design  •  Mock Interviews</text>

    <section id="problem-breakdown">
      <h2>1. LRU Cache Problem Breakdown &amp; Complexity Requirements</h2>
      <p>Why individual data structures fail and why a hybrid approach is required</p>
      <p>The LRU Cache problem asks you to design a fixed-capacity data structure that supports two operations:</p>
<ul><li><code>get(key)</code>: Return the value if the key exists, otherwise return <code>-1</code>. Accessing an item marks it as the <em>most recently used</em>.</li><li><code>put(key, value)</code>: Update the value if the key exists, or insert the key-value pair. If the number of keys exceeds <code>capacity</code>, evict the <em>least recently used</em> key.</li><li><strong>Typical target</strong>: Both <code>get</code> and <code>put</code> can have expected average $O(1)$ time when hash-map operations are expected average $O(1)$ and list updates use known node references.</li></ul>
<h3 id="problem-breakdown-why-single-data-structures-fail">Why Single Data Structures Fail</h3>
<ul><li><strong>Array / Dynamic List</strong>: Provides $O(1)$ access by index, but search by key is $O(N)$ and moving an element to the front requires $O(N)$ shifts.</li><li><strong>Singly Linked List</strong>: Supports $O(1)$ insertion at the head, but searching for an arbitrary node is $O(N)$, and removing a node requires $O(N)$ traversal to find the preceding node pointer.</li><li><strong>Standard Hash Map</strong>: Provides $O(1)$ average key-value lookup, but maintains no sequential ordering of recency.</li></ul>
<h3 id="problem-breakdown-the-dual-data-structure-solution">The Dual Data Structure Solution</h3>
<p>To get expected average $O(1)$ lookup plus constant-time list updates, combine two data structures:</p>
<ol><li><strong>Hash Map (<code>Map&lt;Key, Node&gt;</code>)</strong>: Maps each key to its node in the linked list. Lookup is expected average $O(1)$ under typical hash distribution assumptions.</li><li><strong>Doubly Linked List</strong>: Keeps nodes in recency order. With a direct node reference, unlinking or moving that node takes constant time.</li></ol>
      <aside><h3>LRU Cache Architectural Blueprint</h3><ul><li><strong>Time Complexity (get):</strong> O(1) average lookup via Hash Map</li><li><strong>Time Complexity (put):</strong> O(1) insertion &amp; O(1) eviction via Doubly Linked List</li><li><strong>Space Complexity:</strong> O(Capacity) auxiliary memory</li><li><strong>Pointer Safety:</strong> Dummy Head &amp; Tail Sentinels (Zero Null Checks)</li></ul></aside>

      <aside><h3>Key Interview Takeaways</h3><ul><li>A Doubly Linked List is mandatory (not singly) because removing a node in O(1) requires access to node.prev.</li><li>The HashMap must store pointers/references to the Doubly Linked List Node, not just the raw value.</li></ul></aside>
    </section>

    <section id="sentinel-nodes">
      <h2>2. The Dummy Sentinel Node Technique (Head &amp; Tail)</h2>
      <p>How dummy sentinels simplify pointer manipulation</p>
      <p>Handling edge cases when inserting or removing nodes at linked-list boundaries (empty list, one element, head eviction, tail eviction) can require additional null checks:</p>
<pre><code class="language-java">if (head == null) { ... }
if (node == tail) { ... }
if (node.prev != null) { ... }</code></pre>
<p>Sentinel nodes provide permanent boundaries, which can simplify these cases and reduce conditional branches.</p>
<h3 id="sentinel-nodes-the-sentinel-technique">The Sentinel Technique</h3>
<p>Initialize two permanent dummy nodes: <code>head</code> and <code>tail</code>.</p>
<ul><li>In an empty cache, connect <code>head.next = tail</code> and <code>tail.prev = head</code>.</li><li>Real cached nodes always sit <strong>strictly between</strong> <code>head</code> and <code>tail</code>.</li><li><strong>Head is the Most Recently Used (MRU)</strong> position: freshly accessed or inserted nodes are placed right after <code>head</code>.</li><li><strong>Tail is the Least Recently Used (LRU)</strong> position: the node right before <code>tail</code> (<code>tail.prev</code>) is always the eviction candidate.</li></ul>
<h3 id="sentinel-nodes-the-4-core-o-1-primitives">The 4 Core O(1) Primitives</h3>
<ol><li><strong><code>addNode(Node node)</code></strong>: Links <code>node</code> between <code>head</code> and <code>head.next</code>.</li><li><strong><code>removeNode(Node node)</code></strong>: Unlinks <code>node</code> by connecting <code>node.prev.next = node.next</code> and <code>node.next.prev = node.prev</code>.</li><li><strong><code>moveToHead(Node node)</code></strong>: Calls <code>removeNode(node)</code> followed by <code>addNode(node)</code>.</li><li><strong><code>popTail()</code></strong>: Calls <code>removeNode(tail.prev)</code> and returns the evicted node so its key can be purged from the HashMap.</li></ol>


      <aside><h3>Key Interview Takeaways</h3><ul><li>With dummy head and tail sentinels, head.next and tail.prev are never null, eliminating all boundary conditional checks.</li><li>Every node manipulation reduces to simple pointer swaps with zero risk of NullPointerExceptions.</li></ul></aside>
    </section>

    <section id="java-implementation">
      <h2>3. Complete Production-Grade Java Implementation</h2>
      <p>Idiomatic object-oriented implementation with custom Node class</p>
      <p>Below is the complete, self-contained Java implementation of the LRU Cache matching LeetCode 146 requirements:</p>

      <figure><figcaption>Complete O(1) LRU Cache Implementation in Java with Dummy Sentinels</figcaption><pre><code class="language-java">public class LRUCache {

    // Doubly Linked List Node
    private static class Node {
        int key;
        int value;
        Node prev;
        Node next;

        Node(int key, int value) {
            this.key = key;
            this.value = value;
        }
    }

    private final int capacity;
    private final Map&lt;Integer, Node&gt; cache;
    private final Node head;
    private final Node tail;

    public LRUCache(int capacity) {
        if (capacity &lt;= 0) {
            throw new IllegalArgumentException(&quot;Capacity must be positive&quot;);
        }
        this.capacity = capacity;
        this.cache = new HashMap&lt;&gt;(capacity);

        // Initialize dummy sentinels to eliminate null pointer conditionals
        this.head = new Node(0, 0);
        this.tail = new Node(0, 0);
        head.next = tail;
        tail.prev = head;
    }

    public int get(int key) {
        Node node = cache.get(key);
        if (node == null) {
            return -1;
        }
        // Move accessed node to head (most recently used)
        moveToHead(node);
        return node.value;
    }

    public void put(int key, int value) {
        Node existingNode = cache.get(key);
        if (existingNode != null) {
            // Update existing value and move to MRU head
            existingNode.value = value;
            moveToHead(existingNode);
        } else {
            Node newNode = new Node(key, value);
            cache.put(key, newNode);
            addNode(newNode);

            // If capacity exceeded, evict LRU tail
            if (cache.size() &gt; capacity) {
                Node lru = popTail();
                cache.remove(lru.key);
            }
        }
    }

    // Helper: Insert node immediately after dummy head
    private void addNode(Node node) {
        node.prev = head;
        node.next = head.next;
        head.next.prev = node;
        head.next = node;
    }

    // Helper: Unlink an arbitrary node in O(1)
    private void removeNode(Node node) {
        node.prev.next = node.next;
        node.next.prev = node.prev;
    }

    // Helper: Move existing node to most-recently-used position
    private void moveToHead(Node node) {
        removeNode(node);
        addNode(node);
    }

    // Helper: Evict least-recently-used node right before dummy tail
    private Node popTail() {
        Node lru = tail.prev;
        removeNode(lru);
        return lru;
    }
}</code></pre></figure>
      <aside><h3>Key Interview Takeaways</h3><ul><li>The Node class MUST store both key and value so that when popTail() evicts a node, its key is known for cache.remove(key).</li><li>Always handle the existing key update scenario in put() before checking capacity eviction.</li></ul></aside>
    </section>

    <section id="python-cpp">
      <h2>4. Multi-Language Implementations: Python &amp; Modern C++</h2>
      <p>How to write idiomatic LRU Cache in Python and C++20</p>
      <h3 id="python-cpp-python-implementation-using-collections-ordereddict">Python Implementation (Using <code>collections.OrderedDict</code>)</h3>
<p>In Python, <code>collections.OrderedDict</code> maintains insertion order and exposes <code>move_to_end(key)</code> and <code>popitem(last=False)</code>:</p>
<pre><code class="language-python">from collections import OrderedDict

class LRUCache:
    def __init__(self, capacity: int):
        self.capacity = capacity
        self.cache = OrderedDict()

    def get(self, key: int) -&gt; int:
        if key not in self.cache:
            return -1
        self.cache.move_to_end(key)
        return self.cache[key]

    def put(self, key: int, value: int) -&gt; None:
        if key in self.cache:
            self.cache.move_to_end(key)
        self.cache[key] = value
        if len(self.cache) &gt; self.capacity:
            self.cache.popitem(last=False) # Evicts LRU item (front)</code></pre>
<h3 id="python-cpp-c-20-implementation-std-unordered-map-std-list">C++20 Implementation (<code>std::unordered_map</code> + <code>std::list</code>)</h3>
<p>In C++, use <code>std::list</code> (a doubly linked list) and <code>std::unordered_map</code> storing iterators. Use <code>std::list::splice</code> to relocate nodes in $O(1)$ without copying or memory reallocation:</p>
<pre><code class="language-cpp">#include &lt;unordered_map&gt;
#include &lt;list&gt;

class LRUCache {
private:
    int capacity;
    // List stores pair of {key, value}
    std::list&lt;std::pair&lt;int, int&gt;&gt; dll;
    // Map stores iterator pointing directly to node in dll
    std::unordered_map&lt;int, std::list&lt;std::pair&lt;int, int&gt;&gt;::iterator&gt; map;

public:
    LRUCache(int cap) : capacity(cap) {}

    int get(int key) {
        auto it = map.find(key);
        if (it == map.end()) return -1;
        // Splice moves node to front of dll in O(1)
        dll.splice(dll.begin(), dll, it-&gt;second);
        return it-&gt;second-&gt;second;
    }

    void put(int key, int value) {
        auto it = map.find(key);
        if (it != map.end()) {
            it-&gt;second-&gt;second = value;
            dll.splice(dll.begin(), dll, it-&gt;second);
            return;
        }
        if (dll.size() == capacity) {
            int lruKey = dll.back().first;
            map.erase(lruKey);
            dll.pop_back();
        }
        dll.emplace_front(key, value);
        map[key] = dll.begin();
    }
};</code></pre>


      <aside><h3>Key Interview Takeaways</h3><ul><li>In C++, std::list::splice relocates list elements without copying their values; consult the selected standard-library documentation for complexity and allocator requirements.</li><li>In Python, knowing both OrderedDict and the raw Doubly Linked List approach demonstrates senior depth.</li></ul></aside>
    </section>

    <section id="concurrency-thread-safety">
      <h2>5. Concurrency &amp; Thread-Safety Extensions</h2>
      <p>Scaling LRU Cache across multiple concurrent threads</p>
      <p>Concurrent cache implementations need to coordinate concurrent access. A single <code>synchronized</code> wrapper can limit parallelism when those methods are contended; the impact depends on workload and implementation.</p>
<h3 id="concurrency-thread-safety-the-readwritelock-trap-in-lru-cache">The ReadWriteLock Trap in LRU Cache</h3>
<p>Many candidates suggest using <code>ReentrantReadWriteLock</code>, assuming <code>get()</code> can use the read lock while <code>put()</code> uses the write lock.</p>
<ul><li><strong>The Catch</strong>: In an LRU Cache, <strong><code>get()</code> is NOT a read-only operation</strong>! <code>get()</code> must move the accessed node to the MRU head, mutating <code>prev</code> and <code>next</code> pointers. Therefore, <code>get()</code> requires a WRITE lock, defeating the entire purpose of <code>ReadWriteLock</code>!</li></ul>
<h3 id="concurrency-thread-safety-scalable-concurrency-solutions">Scalable Concurrency Solutions</h3>
<ol><li><strong>Segmented Locking (Striped Locks)</strong>: Divide the key space into $S$ independent segments (like legacy <code>ConcurrentHashMap</code>). Each segment has its own capacity and independent lock.</li><li><strong>Buffered or approximate eviction maintenance</strong>:</li></ol>
<ul><li>Some cache designs separate key lookup from recency or eviction maintenance.</li><li>Synchronization, buffering, and consistency guarantees vary by implementation; consult the selected library&#39;s current documentation and source.</li></ul>


      <aside><h3>Key Interview Takeaways</h3><ul><li>Never claim ReadWriteLock solves LRU cache concurrency without clarifying that get() mutates list pointers.</li><li>Discuss the synchronization and eviction trade-offs of the particular cache implementation being considered.</li></ul></aside>
    </section>

    <section id="interview-follow-ups">
      <h2>6. Common Interview Follow-Ups &amp; Edge Cases</h2>
      <p>Handling TTL expiration, LFU comparison, and memory-bounded sizing</p>
      <p>Interviewers will often extend the standard LRU question with these follow-ups:</p>
<h3 id="interview-follow-ups-1-adding-time-to-live-ttl-expiration">1. Adding Time-To-Live (TTL) Expiration</h3>
<p>How do you support cache keys that expire after a specified duration?</p>
<ul><li><strong>Approach</strong>: Add an <code>expiresAt</code> timestamp to the <code>Node</code>.</li><li><strong>Lazy Expiration</strong>: On <code>get(key)</code>, check if <code>now &gt; node.expiresAt</code>. If expired, evict the node and return <code>-1</code>.</li><li><strong>Active Cleanup</strong>: Maintain a secondary Min-Heap (PriorityQueue) or time-wheel ordered by <code>expiresAt</code>, and run a periodic background cleanup task to purge expired entries before capacity fills up.</li></ul>
<h3 id="interview-follow-ups-2-lru-vs-lfu-least-frequently-used">2. LRU vs LFU (Least Frequently Used)</h3>
<ul><li><strong>LRU</strong>: Evicts based on time since last access. Susceptible to cache pollution during one-off full-table scans.</li><li><strong>LFU</strong>: Evicts based on access frequency counter. Preserves frequently used items better, but requires more memory and historical frequency counters can become stale without age decay.</li></ul>


      <aside><h3>Key Interview Takeaways</h3><ul><li>Be prepared to explain how to augment LRU with TTL using lazy expiration and min-heap tracking.</li><li>Recognize that LRU can suffer from cache pollution during sequential scans.</li></ul></aside>

  <section id="references"><h2>References &amp; Further Reading</h2><ul><li><a href="https://docs.oracle.com/en/java/javase/26/docs/api/java.base/java/util/LinkedHashMap.html" target="_blank" rel="noopener noreferrer">LinkedHashMap (Java SE API)</a> — Oracle Java Documentation</li></ul></section><section id="faqs"><h2>Frequently Asked Questions</h2><details><summary>How does a Doubly Linked List enable constant-time LRU node updates?</summary><p>To unlink a known node in constant time, a doubly linked list stores its previous and next pointers. A singly linked list normally requires traversal to find the preceding node.</p></details><details><summary>How do dummy head and tail sentinel nodes simplify LRU cache pointer manipulation?</summary><p>Dummy head and tail sentinels act as permanent boundaries. The real cached nodes always sit strictly between them. This eliminates edge cases (such as inserting into an empty list, removing the only node, or boundary null pointer checks), reducing code complexity and preventing runtime NullPointerExceptions.</p></details><details><summary>Why does standard ReentrantReadWriteLock fail to scale for a concurrent LRU cache?</summary><p>In a standard cache, get() is a read operation. However, in an LRU cache, get() mutates the list pointers to reposition the accessed node to the most recently used head. Consequently, get() requires a write lock, causing all concurrent reader threads to serialize and eliminating the concurrency benefits of ReadWriteLock.</p></details><details><summary>What is the difference between LRU (Least Recently Used) and LFU (Least Frequently Used)?</summary><p>LRU evicts the item that was accessed the furthest in the past, regardless of how many times it was used before. LFU tracks access frequency and evicts the item with the lowest hit count. LFU is better at resisting cache pollution from one-off bulk scans, but requires more complex O(1) bookkeeping and frequency decay mechanisms.</p></details><details><summary>How can you add Time-To-Live (TTL) expiration to an LRU cache?</summary><p>Add an expiresAt timestamp field to each cache node. Implement lazy expiration on get() (if current time exceeds expiresAt, delete the node and return -1) and active background expiration using a PriorityQueue (Min-Heap) sorted by expiresAt to periodically remove expired entries.</p></details><details><summary>How can concurrent cache implementations separate lookup from eviction maintenance?</summary><p>Some cache designs separate key lookup from recency or eviction maintenance, but synchronization and buffering are implementation-specific. Consult the chosen library's current documentation and source rather than assuming a particular design.</p></details></section></main>

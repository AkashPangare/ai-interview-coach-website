    <header class="my-8"><h1>System Design Interview Guides</h1><p>Explore system design interview case studies that work through requirements, capacity reasoning, architecture choices, and failure handling. These guides pair well with hands-on architecture practice.</p></header>
    <section aria-label="System Design guides"><article><h2><a href="/guides/system-design-tinyurl">System Design: How to Design TinyURL (Architecture, Capacity &amp; SPOF)</a></h2><p>This guide walks through a URL-shortening system design, including requirements, example capacity estimates, database schema, Base62 key generation, caching strategies, and failover trade-offs.</p></article><article><h2><a href="/guides/system-design-rate-limiter">System Design: How to Design an API Rate Limiter (Token Bucket vs Leaky Bucket)</a></h2><p>This guide explores a distributed API rate limiter design, including Token Bucket, Leaky Bucket, Sliding Window Counter, synchronization across gateways, Redis scripting, capacity estimation, and failure-mode trade-offs.</p></article><article><h2><a href="/guides/system-design-notification-service">System Design: How to Design a Notification System at Scale (SMS, Push, Email)</a></h2><p>This guide explores a notification-service design for push, SMS, and email, including priority queues, idempotency, rate limiting, provider integrations, and operational trade-offs.</p></article></section>
